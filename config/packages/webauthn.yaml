webauthn:
    allowed_origins:
        - '%env(WEBAUTHN_ALLOWED_ORIGIN)%'
    credential_repository: 'App\Repository\CredentialRecordRepository'
    user_repository: 'App\Repository\PublicKeyCredentialUserEntityRepository'
    creation_profiles:
        default:
            rp:
                id: '%env(WEBAUTHN_RELYING_PARTY_ID)%'
            authenticator_selection_criteria:
                user_verification: required
            public_key_credential_parameters:
                - !php/const Cose\Algorithms::COSE_ALGORITHM_ES256
                - !php/const Cose\Algorithms::COSE_ALGORITHM_RS256
    request_profiles:
        default:
            rp_id: '%env(WEBAUTHN_RELYING_PARTY_ID)%'
            user_verification: required
    controllers:
        enabled: true
        creation:
            additional_authenticator:
                options_path: '/account/passkeys/options'
                result_path: '/account/passkeys/register'
                user_entity_guesser: 'Webauthn\Bundle\Security\Guesser\CurrentUserEntityGuesser'
