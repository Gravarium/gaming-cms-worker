name: Worker CI

on:
  push:
    branches:
      - main
      - 'worker/account-*'
  pull_request:
    branches:
      - main
      - 'worker/account-*'

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate worker-visible PHP and Symfony
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      APP_ENV: test
      APP_SECRET: ci-only-secret
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/ci.db"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test browser-side security helpers
        run: npm run test:js

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.5"
          extensions: ctype, iconv, intl, mbstring, pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Prepare CI environment file
        run: touch .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Warm Symfony analysis container
        run: APP_ENV=dev APP_DEBUG=1 php bin/console cache:warmup --env=dev

      - name: Analyse application types
        run: vendor/bin/phpstan analyse --error-format=table --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Lint migration PHP
        run: find migrations -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint YAML configuration
        run: php bin/console lint:yaml config --parse-tags --env=test

      - name: Lint Twig templates
        run: php bin/console lint:twig templates --env=test

      - name: Validate dependency container
        run: php bin/console lint:container --env=test

      - name: Compile AssetMapper assets
        run: php bin/console asset-map:compile --env=test

      - name: Validate Doctrine mappings
        run: php bin/console doctrine:schema:validate --skip-sync --env=test

      - name: Create test database schema
        run: php bin/console doctrine:schema:create --env=test

      - name: Run worker-visible application tests with coverage visibility
        run: vendor/bin/phpunit --configuration phpunit.dist.xml --coverage-text --coverage-clover=var/coverage.xml

  postgres-migrations:
    name: Validate worker-visible PostgreSQL 18 migration chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gaming_cms_ci_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d gaming_cms_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_SECRET: ci-only-secret
      DATABASE_URL: "postgresql://app:ci-only-password@127.0.0.1:5432/gaming_cms_ci?serverVersion=18&charset=utf8"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.5"
          extensions: ctype, iconv, intl, mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Prepare CI environment file
        run: touch .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply complete migration chain
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Confirm migration status
        run: php bin/console doctrine:migrations:status --env=test
